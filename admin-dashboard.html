<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frikkie Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #8B7355 0%, #6B5D4F 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            border-left: 5px solid #8B7355;
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 40px;
            font-weight: 700;
            color: #8B7355;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #f5f5f5 0%, #eaeaea 100%);
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        .card-header h2 {
            font-size: 18px;
            color: #333;
            margin: 0;
        }

        .card-body {
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .conversation-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            background: #fafafa;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .conversation-item:hover {
            background: #f0f0f0;
            transform: translateX(4px);
        }

        .conversation-item:last-child {
            border-bottom: none;
        }

        .conv-email {
            font-weight: 600;
            color: #333;
            font-size: 13px;
        }

        .conv-meta {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .conv-badge {
            display: inline-block;
            background: #e8e3d8;
            color: #8B7355;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #8B7355;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #c62828;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #8B7355 0%, #6B5D4F 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            margin-top: 15px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 115, 85, 0.3);
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            opacity: 0.3;
            margin-bottom: 12px;
        }

        .chart-container {
            padding: 20px;
            background: #fafafa;
            border-radius: 6px;
            margin: 15px 0;
        }

        .mini-chart {
            display: flex;
            gap: 4px;
            align-items: flex-end;
            height: 60px;
        }

        .bar {
            flex: 1;
            background: linear-gradient(180deg, #8B7355 0%, #6B5D4F 100%);
            border-radius: 3px;
            min-height: 5px;
            transition: all 0.3s;
        }

        .bar:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎩 Frikkie Admin Dashboard</h1>
            <p>4x4 Factory SA - AI Assistant Analytics</p>
        </header>

        <div class="stats-grid" id="statsGrid">
            <div class="loading">
                <div class="loading-spinner"></div>
                Loading...
            </div>
        </div>

        <div class="content-grid">
            <div class="card">
                <div class="card-header">
                    <h2>📊 Recent Conversations</h2>
                </div>
                <div class="card-body" id="conversationsContainer">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        Loading conversations...
                    </div>
                </div>
                <div style="padding: 0 20px 20px;">
                    <button class="refresh-btn" onclick="loadData();">Refresh Data</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>💰 Cost Analysis</h2>
                </div>
                <div class="card-body" id="costContainer">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        Loading...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://frikkie-shopify-assistant-production.up.railway.app';

        async function loadData() {
            try {
                // Fetch stats
                const statsRes = await fetch(API_BASE + '/api/admin/stats');
                const stats = await statsRes.json();

                // Fetch conversations
                const convsRes = await fetch(API_BASE + '/api/admin/conversations');
                const convs = await convsRes.json();

                renderStats(stats);
                renderConversations(convs.conversations || []);
                renderCostAnalysis(stats);
            } catch (err) {
                console.error('Error loading data:', err);
                document.getElementById('statsGrid').innerHTML = `
                    <div class="error">Error loading dashboard: ${err.message}</div>
                `;
            }
        }

        function renderStats(stats) {
            const container = document.getElementById('statsGrid');
            
            const totalCost = (stats.totalCost || 0).toFixed(4);
            const avgCostPerConv = stats.conversations > 0 
                ? (stats.totalCost / stats.conversations).toFixed(4) 
                : '0.00';

            container.innerHTML = `
                <div class="stat-card">
                    <h3>Total Conversations</h3>
                    <div class="stat-value">${stats.conversations || 0}</div>
                    <div class="stat-label">Active chats</div>
                </div>
                <div class="stat-card">
                    <h3>Total Messages</h3>
                    <div class="stat-value">${stats.messages || 0}</div>
                    <div class="stat-label">User + Bot combined</div>
                </div>
                <div class="stat-card">
                    <h3>Total API Cost</h3>
                    <div class="stat-value">$${totalCost}</div>
                    <div class="stat-label">USD (Claude API)</div>
                </div>
                <div class="stat-card">
                    <h3>Avg Cost per Chat</h3>
                    <div class="stat-value">$${avgCostPerConv}</div>
                    <div class="stat-label">USD per conversation</div>
                </div>
            `;
        }

        function renderConversations(conversations) {
            const container = document.getElementById('conversationsContainer');
            
            if (!conversations || conversations.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>No conversations yet</p>
                        <small>Frikkie is ready to chat!</small>
                    </div>
                `;
                return;
            }

            const html = conversations.map(conv => {
                const date = new Date(conv.created_at);
                const formatted = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                return `
                    <div class="conversation-item">
                        <div class="conv-email">${conv.email || 'Unknown'}</div>
                        <div class="conv-meta">
                            ${formatted} • ${conv.messages} messages
                        </div>
                        ${conv.order_number ? `<div class="conv-badge">Order: ${conv.order_number}</div>` : ''}
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }

        function renderCostAnalysis(stats) {
            const container = document.getElementById('costContainer');
            
            const totalCost = stats.totalCost || 0;
            const conversations = stats.conversations || 1;
            const messages = stats.messages || 1;
            
            const costPerMessage = (totalCost / messages).toFixed(6);
            const costPerConversation = (totalCost / conversations).toFixed(4);
            const avgMessagesPerConv = (messages / conversations).toFixed(1);

            container.innerHTML = `
                <div style="padding: 20px 0;">
                    <div style="margin-bottom: 20px;">
                        <h4 style="color: #666; font-size: 13px; margin-bottom: 8px;">Cost Breakdown</h4>
                        <div style="font-size: 24px; color: #8B7355; font-weight: 700;">$${totalCost.toFixed(4)}</div>
                        <small style="color: #999;">Total spent on API calls</small>
                    </div>

                    <div style="background: #f5f5f5; padding: 15px; border-radius: 6px; margin-bottom: 15px;">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div>
                                <div style="font-size: 12px; color: #999; margin-bottom: 4px;">Per Message</div>
                                <div style="font-size: 18px; color: #8B7355; font-weight: 600;">$${costPerMessage}</div>
                            </div>
                            <div>
                                <div style="font-size: 12px; color: #999; margin-bottom: 4px;">Per Conversation</div>
                                <div style="font-size: 18px; color: #8B7355; font-weight: 600;">$${costPerConversation}</div>
                            </div>
                        </div>
                    </div>

                    <div style="background: #f9f9f9; padding: 12px; border-radius: 6px; border-left: 3px solid #8B7355;">
                        <div style="font-size: 12px; color: #666;">
                            <strong>${avgMessagesPerConv}</strong> avg messages per conversation
                        </div>
                    </div>
                </div>
            `;
        }

        // Load data on page load
        loadData();

        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
